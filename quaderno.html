<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quaderno · Leggio del piano</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: una dispensa a colonna unica, come un capitolo stampato (testatina, paragrafi numerati, figure numerate),
   con il riassunto su un foglio a quadretti in penna rossa; indice analitico in fondo come in un libro. */
:root{
  --paper:#F5F6F8;
  --sheet:#FFFFFF;
  --ink:#1C2230;
  --ink-2:#4F5869;
  --rule:#D4D9E2;
  --red:#B42318;
  --red-soft:#F6DEDA;
  --blue:#244A8F;
  --blue-soft:#DCE5F4;
  --grid:rgba(36,74,143,.11);
  --ok:#22704C;
  --ask:#9A5800;
  --key-w:#FFFFFF;
  --key-b:#1C2230;
  --font-text:"STIX Two Text","STIX Two","Cambria","Georgia",serif;
  --font-ui:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --s-1:.8125rem; --s0:1.0625rem; --s1:1.25rem; --s2:1.5rem; --s3:2rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111419; --sheet:#171B22; --ink:#E5E8EE; --ink-2:#9BA4B5; --rule:#2B313C;
    --red:#FF8B7B; --red-soft:#3A2220; --blue:#93B2EE; --blue-soft:#1E2A40; --grid:rgba(147,178,238,.09);
    --ok:#6CC49B; --ask:#EBB15A; --key-w:#D9DDE5; --key-b:#0B0D11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111419; --sheet:#171B22; --ink:#E5E8EE; --ink-2:#9BA4B5; --rule:#2B313C;
  --red:#FF8B7B; --red-soft:#3A2220; --blue:#93B2EE; --blue-soft:#1E2A40; --grid:rgba(147,178,238,.09);
  --ok:#6CC49B; --ask:#EBB15A; --key-w:#D9DDE5; --key-b:#0B0D11;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-text);font-size:var(--s0);line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:42rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}

/* testata */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:.8rem .55rem;border-bottom:1px solid var(--rule);display:grid;gap:.45rem}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.brand h1{font-family:var(--font-text);font-weight:600;font-style:italic;font-size:var(--s1);margin:0;letter-spacing:.005em}
.brand .stamp{font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2)}
nav.views{display:flex;gap:.25rem;align-items:center;overflow-x:auto;scrollbar-width:none;font-family:var(--font-ui);font-size:.875rem}
nav.views::-webkit-scrollbar{display:none}
nav.views button{background:none;border:0;padding:.3rem .55rem;border-radius:4px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-weight:500}
nav.views button[aria-current="page"]{color:var(--red);background:var(--red-soft)}
nav.views .sep{color:var(--rule);padding-inline:.1rem}
nav.views .num{font-variant-numeric:tabular-nums;min-width:2rem}

main{padding-top:1.5rem;display:grid;gap:2.25rem}
.loading{font-family:var(--font-ui);color:var(--ink-2);display:grid;gap:.5rem;padding:2rem 0}
.loading strong{font-family:var(--font-text);font-size:var(--s1);color:var(--ink);font-weight:600}

/* capitolo */
.running{font-family:var(--font-text);font-variant:small-caps;letter-spacing:.06em;font-size:.95rem;color:var(--ink-2);display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--ink);padding-bottom:.2rem;flex-wrap:wrap}
.chapter-head{display:grid;gap:.9rem}
.chapter-head h2{font-size:var(--s3);line-height:1.15;font-weight:700;margin:0;text-wrap:balance}
.chapter-head .kicker{font-family:var(--font-text);font-style:italic;font-size:var(--s1);color:var(--red)}
.cornice{display:grid;gap:.75rem;font-size:1.09rem}
.label{font-family:var(--font-text);font-variant:small-caps;letter-spacing:.08em;font-size:.95rem;color:var(--red);font-weight:600}

/* riassunto a quadretti */
.riassunto{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.125rem 1.125rem;border:1px solid var(--rule);padding:1rem 1rem 1.1rem;display:grid;gap:.8rem}
.riassunto>.label{font-style:italic;font-variant:normal;letter-spacing:0;font-size:var(--s1)}
.schede{columns:2 15rem;column-gap:1.5rem}
.scheda{break-inside:avoid;margin:0 0 .95rem;font-family:var(--font-ui);font-size:.95rem;line-height:1.45;display:grid;gap:.25rem}
.scheda h4{margin:0;font-family:var(--font-text);font-style:italic;font-weight:600;color:var(--red);font-size:1.05rem}
.scheda p,.scheda ul{margin:0}
.scheda ul{padding-left:1rem}
.scheda strong{font-weight:600;color:var(--ink)}
.scheda table{font-size:.85rem}

/* sezioni */
.sezione{display:grid;gap:.9rem;scroll-margin-top:13.5rem}
.sezione h3{margin:0;font-size:var(--s2);line-height:1.25;font-weight:700;display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:baseline;text-wrap:balance}
.sezione h3 .n{color:var(--red);font-variant-numeric:tabular-nums lining-nums;font-weight:600}
.md{display:grid;gap:.75rem;min-width:0}
.md p,.md ul,.md ol{margin:0}
.md ul,.md ol{padding-left:1.3rem;display:grid;gap:.3rem}
.md em{font-style:italic}
.md strong{font-weight:700}
.tab{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-family:var(--font-ui);font-size:.9375rem;font-variant-numeric:tabular-nums;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);min-width:100%}
th,td{text-align:left;padding:.3rem .7rem .3rem 0;vertical-align:top}
thead th{border-bottom:1px solid var(--ink);font-weight:600}
td:first-child,th:first-child{white-space:nowrap}

/* note a margine: segni da correttore di bozze */
.nota{display:grid;grid-template-columns:1.6rem 1fr;gap:.15rem;font-family:var(--font-ui);font-size:.9375rem;line-height:1.45;color:var(--ink-2);padding-left:.2rem;min-width:0}
.nota .segno{font-family:var(--font-text);font-weight:700;font-size:1.05rem;line-height:1.3}
.nota .corpo{display:grid;gap:.2rem;min-width:0}
.nota .tipo{font-variant:small-caps;letter-spacing:.06em;font-weight:600;margin-right:.35rem}
.nota .fonte{font-size:.8125rem;overflow-wrap:anywhere}
.nota .risposta{color:var(--ink)}
.nota.verificato .segno,.nota.verificato .tipo{color:var(--ok)}
.nota.precisazione .segno,.nota.precisazione .tipo{color:var(--blue)}
.nota.da_chiedere .segno,.nota.da_chiedere .tipo{color:var(--ask)}
.nota.incerto .segno,.nota.incerto .tipo{color:var(--ink-2)}
.nota .md{gap:.3rem}

.esempio{display:grid;gap:.6rem}
.esempio .titolo{font-weight:700}
.esempio .titolo em{font-weight:400}
.oltre{border:1px solid var(--rule);background:var(--sheet);padding:.85rem 1rem;display:grid;gap:.55rem}
.oltre .label{color:var(--blue)}

figure{margin:0;display:grid;gap:.45rem;justify-items:center;min-width:0}
figure .fig{width:100%;overflow-x:auto;display:flex;justify-content:center}
figure svg.kb{width:100%;max-width:30rem;height:auto}
figcaption{font-family:var(--font-ui);font-size:.875rem;color:var(--ink-2);text-align:center;max-width:34rem}
figcaption b{color:var(--ink);font-weight:600}
.abc{width:100%;max-width:32rem;color:var(--ink)}
.abc svg{max-width:100%}

/* chiusura capitolo e sommario */
.blocco{display:grid;gap:.75rem}
.blocco h3{margin:0;font-size:var(--s1);font-weight:700}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start}
.check{appearance:none;-webkit-appearance:none;width:1.3rem;height:1.3rem;margin:.2rem 0 0;border:1.5px solid var(--red);border-radius:3px;background:var(--sheet);display:grid;place-content:center;cursor:pointer}
.check::after{content:"";width:.68rem;height:.36rem;border-left:2px solid var(--sheet);border-bottom:2px solid var(--sheet);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check:checked{background:var(--red)}
.check:checked::after{opacity:1}
.check:disabled{cursor:default;opacity:.55}
.todo .done .t{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1px}
.meta{font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2);font-variant-numeric:tabular-nums}
.marks{display:flex;gap:.2rem .8rem;flex-wrap:wrap}
.domande{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.domande li{display:grid;grid-template-columns:1.6rem 1fr;gap:.15rem}
.domande .segno{font-weight:700;color:var(--ask);font-size:1.05rem}
.domande .ok .segno{color:var(--ok)}
.ref{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-family:var(--font-ui);font-size:var(--s-1);font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:2px}
.fonte-cap{font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2);border-top:1px solid var(--rule);padding-top:.6rem}
.pager{display:flex;justify-content:space-between;gap:1rem;font-family:var(--font-ui);font-size:.9rem;flex-wrap:wrap}
.pager button{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-align:left}
.pager button:last-child{text-align:right;margin-left:auto}

.toc{list-style:none;margin:0;padding:0;display:grid;gap:1.1rem}
.toc .cap{display:grid;gap:.35rem}
.toc .cap-row{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;align-items:baseline}
.toc .cap-row .n{font-weight:700;color:var(--red);font-variant-numeric:lining-nums}
.toc .cap-row .t{font-weight:700;font-size:1.1rem;line-height:1.3}
.toc .cap-row .d{grid-column:2;font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2)}
.toc ol{list-style:none;margin:0;padding:0 0 0 2rem;display:grid;gap:.15rem}
.toc ol button{background:none;border:0;padding:.1rem 0;cursor:pointer;text-align:left;display:grid;grid-template-columns:2.4rem 1fr;gap:.2rem;width:100%;color:var(--ink)}
.toc ol .n{color:var(--ink-2);font-variant-numeric:tabular-nums lining-nums}
.prossima{font-family:var(--font-ui);font-size:.95rem}
.prossima strong{font-weight:600}
.box{border:1px solid var(--rule);background:var(--sheet);padding:1rem;display:grid;gap:1.1rem}

/* indice analitico */
.indice{display:grid;gap:1.4rem}
.lettera{display:grid;gap:.7rem}
.lettera>h3{margin:0;font-size:var(--s2);color:var(--red);font-weight:600;font-style:italic;border-bottom:1px solid var(--rule);line-height:1.3}
.voce{display:grid;gap:.15rem}
.voce .term{font-weight:700}
.voce .area{font-variant:small-caps;letter-spacing:.06em;color:var(--ink-2);font-size:.9rem;margin-left:.4rem;font-weight:400}
.voce .def{font-size:.98rem}
.voce .refs{display:flex;gap:.2rem .8rem;flex-wrap:wrap}
.toast{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:999px;padding:.55rem 1rem;font-family:var(--font-ui);font-size:var(--s-1);max-width:36rem}

/* tastiera */
svg.kb .kw{fill:var(--key-w);stroke:var(--ink-2);stroke-width:1}
svg.kb .kb-k{fill:var(--key-b);stroke:var(--key-b);stroke-width:1}
svg.kb .kw.hi{fill:var(--red-soft)}
svg.kb .kw.hi2{fill:var(--blue-soft)}
svg.kb .kb-k.hi{fill:var(--red);stroke:var(--red)}
svg.kb .kb-k.hi2{fill:var(--blue);stroke:var(--blue)}
svg.kb text{font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;font-size:11px;text-anchor:middle}
svg.kb .lab{fill:var(--red);font-weight:600}
svg.kb .lab2{fill:var(--blue);font-weight:600}
svg.kb .labk{fill:var(--sheet);font-weight:600;font-size:9.5px}
svg.kb .step{fill:var(--ink-2);font-size:10.5px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* Sezioni dell'app (come nel Leggio) */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--rule)}
.tabs a{min-height:40px;border-radius:9px;font:600 .9rem/1 var(--font-ui);color:var(--ink-2);text-decoration:none;display:flex;align-items:center;justify-content:center}
.tabs a[aria-current="page"]{background:var(--sheet);color:var(--ink)}
.tabs a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav.views button{flex:none}
/* Ordine del quaderno: per lezione (come è stato studiato) o per argomento (come un manuale) */
.ordine{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center;font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2)}
.ordine .seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:10px;background:var(--rule)}
.ordine button{min-height:36px;border:0;border-radius:8px;background:none;font:600 .875rem/1 var(--font-ui);color:var(--ink-2);cursor:pointer}
.ordine button[aria-pressed="true"]{background:var(--sheet);color:var(--red)}
/* Fonti e verifiche di un paragrafo: chiuse, in fondo */
details.verifiche{font-family:var(--font-ui);font-size:.9rem;line-height:1.45;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:.45rem;min-width:0}
details.verifiche summary{cursor:pointer;font-weight:600;color:var(--ok);min-height:32px;display:flex;align-items:center;gap:.4rem}
details.verifiche ul{list-style:none;margin:.3rem 0 0;padding:0;display:grid;gap:.55rem}
details.verifiche li{display:grid;grid-template-columns:5.6rem 1fr;gap:.5rem;min-width:0}
details.verifiche .metodo{font-variant:small-caps;letter-spacing:.05em;font-weight:600;color:var(--ink)}
details.verifiche .md{gap:.3rem;overflow-wrap:anywhere;min-width:0}
details.verifiche a{color:var(--blue)}
.dove{font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2);margin:-.5rem 0 0}
.md button.ref{font-size:inherit;font-family:inherit}
ol.toc .intro{font-family:var(--font-ui);font-size:var(--s-1);color:var(--ink-2);margin:.1rem 0 .3rem}
/* Chiave del quaderno */
.loading input.chiave{font:500 1rem/1.2 var(--font-ui);padding:.75rem .9rem;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);width:100%;box-sizing:border-box}
.loading button.apri{justify-self:start;font:600 .95rem/1 var(--font-ui);padding:.8rem 1.1rem;border-radius:10px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
</style>
</head>

<div class="wrap">
  <header class="top">
    <nav class="tabs" aria-label="Sezioni dell'app"><a href="./#oggi">Oggi</a><a href="./#esercizi">Esercizi</a><a href="quaderno.html" aria-current="page">Quaderno</a><a href="pattern.html">Pattern</a></nav>
    <div class="brand">
      <h1>Quaderno di piano</h1>

      <span id="ordine-lab">Ordine</span>
      <div class="seg" role="group" aria-labelledby="ordine-lab">
        <button type="button" data-ordine="lezioni">Per lezione</button>
        <button type="button" data-ordine="argomenti">Per argomento</button>
      </div>

    <nav class="views" id="nav" aria-label="Sezioni del quaderno"></nav>

</div>

      h("span", { class: "label", text: "Riassunto" }),
      h("div", { class: "schede" }, arr(l.riassunto).map(r => { const sc = h("div", { class: "scheda" }, h("h4", { text: str(r.titolo) })); sc.append(...[...md(r.md).childNodes]); return sc; }))));
    if (arr(l.sezioni).length) {
      for (const sez of arr(l.sezioni)) out.push(sezione(l, sez, num, false));
    } else if (arr(l.sintesi).length) {
      out.push(h("section", { class: "sezione" }, h("h3", {}, h("span", { text: "In breve" })),
        h("div", { class: "md" }, h("ul", {}, arr(l.sintesi).map(x => h("li", { text: str(x) }))))));
    }
    const qs = arr(l.domande).map(domById).filter(q => q && str(q.stato) !== "risolta");
    out.push(h("section", { class: "box" },
      h("div", { class: "blocco" }, h("h3", { text: "Compiti" }), todoList(l)),
      qs.length ? h("div", { class: "blocco" }, h("h3", { text: "Da chiarire a lezione" }), h("ul", { class: "domande" }, qs.map(domandaItem))) : null,
      l.note ? h("p", { class: "meta", text: str(l.note) }) : null));
    if (l.fonte) out.push(h("p", { class: "fonte-cap", text: "Da dove viene il capitolo: " + str(l.fonte) }));
    const prev = byNum(l._n - 1), next = byNum(l._n + 1);
    if (prev || next) out.push(h("nav", { class: "pager", "aria-label": "Altri capitoli" },
      prev ? h("button", { type: "button", onclick: () => go("cap-" + prev._n), text: "← Cap. " + prev._n + " · " + str(prev.titolo) }) : null,
      next ? h("button", { type: "button", onclick: () => go("cap-" + next._n), text: "Cap. " + next._n + " · " + str(next.titolo) + " →" }) : null));
    return out;
  }

  function viewParte(n) {
    const ps = parti(), p = ps.find(x => x.n === n);
    if (!p) return [h("div", { class: "loading" }, h("strong", { text: "Questa parte non c'è" }), h("button", { class: "ref", type: "button", onclick: () => go("sommario"), text: "Torna al sommario" }))];
    const num = numeri();
    const out = [h("section", { class: "chapter-head" },
      h("div", { class: "running" }, h("span", { text: "Parte " + (ROMANI[p.n - 1] || p.n) }), h("span", { text: p.sez.length + " paragrafi" })),
      h("h2", { text: p.titolo }),
      p.intro ? h("div", { class: "cornice" }, h("span", { class: "label", text: "In questa parte" }), md(p.intro)) : null)];
    for (const w of p.sez) out.push(sezione(w.l, w.s, num, true));
    const prev = ps.find(x => x.n === n - 1), next = ps.find(x => x.n === n + 1);
    if (prev || next) out.push(h("nav", { class: "pager", "aria-label": "Altre parti" },
      prev ? h("button", { type: "button", onclick: () => go("parte-" + prev.n), text: "← Parte " + (ROMANI[prev.n - 1] || prev.n) + " · " + prev.titolo }) : null,
      next ? h("button", { type: "button", onclick: () => go("parte-" + next.n), text: "Parte " + (ROMANI[next.n - 1] || next.n) + " · " + next.titolo + " →" }) : null));
    return out;
  }

  function viewIndice() {
    const out = [h("section", { class: "chapter-head" },
      h("div", { class: "running" }, h("span", { text: "Indice analitico" }), h("span", { text: S.argomenti.length + " voci" })),
      h("h2", { text: "Indice analitico" }),
      h("p", { class: "cornice", text: "Gli argomenti in ordine alfabetico, con i paragrafi in cui compaiono." }))];
    const voci = S.argomenti.slice().sort((a, b) => str(a.titolo).localeCompare(str(b.titolo), "it", { sensitivity: "base" }));
    const groups = new Map();
    for (const a of voci) {
      const L = (str(a.titolo).normalize("NFD").replace(/[̀-ͯ]/g, "")[0] || "#").toUpperCase();
      if (!groups.has(L)) groups.set(L, []); groups.get(L).push(a);
    }
    out.push(h("div", { class: "indice" }, [...groups].map(([L, items]) => h("section", { class: "lettera" }, h("h3", { text: L }),
      items.map(a => {
        const refs = refsFor(a._id);
        return h("div", { class: "voce" },
          h("p", {}, h("span", { class: "term", text: str(a.titolo) || a._id }), a.area ? h("span", { class: "area", text: str(a.area).toLowerCase() }) : null),
          a.definizione ? h("p", { class: "def", text: str(a.definizione) }) : null,
          refs.length ? h("div", { class: "refs" }, refs.map(r => h("button", { class: "ref", type: "button", onclick: () => goSec(r.l, r.s), text: "§" + str(r.s.num) + " " + str(r.s.titolo) }))) : null);
      })))));
    return out;
  }

  function render() {
    renderNav();
    const main = document.getElementById("main");
    const n = notice();
    if (n) { main.replaceChildren(n); return; }
    const m = /^cap-(\d+)$/.exec(S.view), mp = /^parte-(\d+)$/.exec(S.view);
    const nodes = S.view === "indice" ? viewIndice() : mp ? viewParte(Number(mp[1])) : m ? viewCapitolo(Number(m[1])) : viewSommario();
    main.replaceChildren(...nodes);
    const st = document.getElementById("stamp");
    st.textContent = S.stato && S.stato.aggiornato ? "Aggiornato " + dShort(S.stato.aggiornato) : "";
    drawAbc();
  }

  // ---------- avvio
  const fromHash = location.hash.slice(1);
  if (VIEW_RE.test(fromHash)) S.view = fromHash;
  // «#par-5.4» (dalle tavole di Pattern) apre il quaderno su quel paragrafo, appena i dati sono pronti
  const mPar = /^par-(\d+\.\d+)$/.exec(fromHash); if (mPar) S.daAprire = mPar[1];
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAbc); } catch (e) { /* older browsers */ }
  try { new MutationObserver(drawAbc).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) { /* not supported */ }
  render();

  // ---------- dati: il quaderno cifrato (AES-256-GCM); la chiave resta su questo telefono
  const LS_K = "leggio-chiave";
  function b64d(s) {
    s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u;
  }
  function chiaveDaIndirizzo() {
    const m = /(?:^|[#&])chiave=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return "";
    try { history.replaceState(null, "", location.pathname + "#sommario"); } catch (e) { /* non disponibile */ }
    return m[1];
  }
  function chiaveSalvata() { try { return localStorage.getItem(LS_K) || ""; } catch (e) { return ""; } }
  // La chiave si salva sul telefono solo dopo che ha aperto davvero il quaderno.
  // Quella arrivata col link resta in prova (memoria della scheda) finché non si sa se apre: un problema di rete non la perde.
  const SS_K = "leggio-chiave-in-prova";
  function inProva(k) { try { if (k) sessionStorage.setItem(SS_K, k); else sessionStorage.removeItem(SS_K); } catch (e) { /* solo in memoria */ } S.candidata = k || ""; }
  function chiaveInProva() { if (S.candidata) return S.candidata; try { return sessionStorage.getItem(SS_K) || ""; } catch (e) { return ""; } }
  async function apriCon(k, f) {
    const key = await crypto.subtle.importKey("raw", b64d(k), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(f.iv) }, key, b64d(f.dati));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function carica(scritta) {
    const daLink = chiaveDaIndirizzo(); if (daLink) inProva(daLink);
    const prove = [...new Set([scritta, chiaveInProva(), S.chiave, chiaveSalvata()].filter(Boolean))];
    if (!prove.length) { S.dbState = "chiave"; render(); return; }
    let f;
    try { const r = await fetch("quaderno.cifrato.json", { cache: "no-store" }); if (!r.ok) throw new Error(String(r.status)); f = await r.json(); }
    catch (e) { S.dbState = "rete"; render(); return; }
    for (const k of prove) {
      let d;
      try { d = await apriCon(k, f); } catch (e) { continue; }
      S.lezioni = arr(d.lezioni); S.argomenti = arr(d.argomenti); S.domande = arr(d.domande);
      S.stato = d.stato || null; S.percorso = d.percorso || null; S.manuale = d.manuale || null;
      S.loaded = { lezioni: true, argomenti: true, domande: true }; S.error = null; S.dbState = "ready";
      S.chiave = k; inProva(""); try { localStorage.setItem(LS_K, k); } catch (e) { /* vale per questa apertura */ }
      const chiesto = S.daAprire, w = chiesto ? secByNum(chiesto) : null; S.daAprire = null;
      if (w) goSec(w.l, w.s); else if (chiesto) go("sommario"); else render();
      return;
    }
    inProva(""); S.dbState = "errata"; render();
  }
  window.addEventListener("hashchange", () => { if (/chiave=/.test(location.hash)) { S.dbState = "loading"; render(); carica(); } });
  window.addEventListener("online", () => { if (S.dbState === "rete") { S.dbState = "loading"; render(); carica(); } });
  carica();
})();
</script>

if ("serviceWorker" in navigator && (/\.github\.io$/.test(location.hostname) || ["localhost", "127.0.0.1"].includes(location.hostname))) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
